# ==============================================================================
# Docker Compose Stack Specification
# Adheres to Homelab Systems Lifecycle (HSL) Container Deployment Standards
# ==============================================================================
---
services:
  portal:
    image: ${IMAGE_NAME:-ghcr.io/mnaatjes/docker-hello-world:v1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-hello-world
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - STARFLEET_VESSEL=${STARFLEET_VESSEL:-NX-01 Enterprise}
      - WARP_CORE_AUTHORIZATION_CODE=${WARP_CORE_AUTHORIZATION_CODE:-NX-DEFAULT-0000}
    volumes:
      - ./data/logs:/var/log/caddy
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          wget --no-verbose --tries=1 --spider
          http://localhost:8080/ || exit 1
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
